apiVersion: v1
kind: Service
metadata:
  name: republicschool-ui-service
  annotations:
    cloud.google.com/neg: '{"ingress": true}'  # Required for Ingress to use ALB backend
spec:
  selector:
    app: republicschool-ui
  type: NodePort
  ports:
    - port: 80
      targetPort: 3002
      protocol: TCP

