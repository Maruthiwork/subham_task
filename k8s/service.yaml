apiVersion: v1
kind: Service
metadata:
  name: republicschool-ui-service
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"80":{}}}'
spec:
  type: NodePort                 # Changed from ClusterIP to NodePort
  selector:
    app: republicschool-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
