name: Build and Deploy to GKE

on:
  push:
    branches:
      - maruthi-gk

env:
  PROJECT_ID: maruti-project-454712
  GKE_CLUSTER: cluster-1
  GKE_ZONE: asia-south1-c
  DEPLOYMENT_NAME: republicschool-ui
  IMAGE: republicschool-ui

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Authenticate with GCP using service account key
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Install Google Cloud CLI and necessary components
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      # Configure GKE cluster credentials
      - name: Configure GKE context
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      # (Optional) Authenticate Docker to push to GCR
      - name: Authenticate Docker to GCR
        run: |
          gcloud auth configure-docker gcr.io

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:$GITHUB_SHA \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg GITHUB_REF="$GITHUB_REF" \
            .

      # Push Docker image to Google Container Registry
      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:$GITHUB_SHA

      # Deploy Kubernetes manifests
      - name: Deploy to GKE
        run: |
          # Replace image tag in deployment.yml
          sed -i "s|image: .*|image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:$GITHUB_SHA|g" k8s/deployment.yaml

          # Apply manifests
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
         

      # Verify rollout status
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}
