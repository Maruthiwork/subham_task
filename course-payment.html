    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

    <script src="/script.js"></script> <!-- Keep for global cashfree, modal instances, and original form logic if any part of site still uses it -->

    <script>
        // --- Start of Course-Specific Payment Functions ---

        // These functions are adapted from script.js for a separate course payment flow.
        // They will use the global 'cashfree' object and modal instances initialized by script.js.

        const createCoursePaymentDetailsHTML = (details) => {
            // Ensure order_amount is a number before calling toFixed
            const amount = parseFloat(details.order_amount);
            const formattedAmount = `Rs.${!isNaN(amount) ? amount.toFixed(2) : '0.00'}`;
            const displayDate = details.created_at || new Date().toISOString().split("T")[0];

            return `
            <div class="payment-details-view">
                <div class="payment-header">
                    <h2>Course Payment Confirmation</h2>
                    <p>Please review your details before proceeding with the payment.</p>
                </div>
                <div class="order-details">
                    <h3>Your order details</h3>
                    <dl class="details-grid">
                        <dt>Order Number:</dt>
                        <dd>${details?.order_id || "N/A"}</dd>

                        <dt>Payable Amount:</dt>
                        <dd>${formattedAmount}</dd>

                        <dt>Name:</dt>
                        <dd>${details?.customer_details?.customer_name || "N/A"}</dd>

                        <dt>Payment Mode:</dt>
                        <dd>ONLINE_CC</dd>

                        <dt>Order Date:</dt>
                        <dd>${displayDate}</dd>

                        <dt>Mobile:</dt>
                        <dd>${details?.customer_details?.customer_phone || "N/A"}</dd>

                        <dt>Email:</dt>
                        <dd>${details?.customer_details?.customer_email || "N/A"}</dd>
                    </dl>
                </div>
                <div class="pay-now-section">
                    <button type="button" class="btn-pay-now" id="pay-now-course-modal-button" data-order-number="${details.order_id}">Pay Now</button>
                </div>
                <div class="payment-disclaimer">
                    <strong>Disclaimer:</strong> You are about to disclose sensitive financial information to a third party for further processing of the payment/service. Kindly note that the personal information is not being processed by Republic School of Journalism (RSJ), a division of Republic Media Network is not responsible for the information provided to the third parties. For more details on how your personal information will be used, stored and processed, check the privacy policy of the third party website.
                </div>
            </div>`;
        };

        const createCoursePaymentSuccessHTML = () => {
            return `
            <div class="payment-result-view">
                <div class="result-icon success"></div>
                <h2 class="success">THANK YOU FOR COURSE PAYMENT</h2>
                <p>Your payment has been received successfully.<br>Our team will get in touch with you soon regarding course access.</p>
                <button type="button" class="btn-result-action home" id="go-home-course-button">GO TO HOME PAGE <i class="bi bi-arrow-right-short"></i></button>
            </div>`;
        };

        const createCoursePaymentFailureHTML = () => {
            return `
            <div class="payment-result-view">
                <div class="result-icon failure"></div>
                <h2 class="failure">Course Payment Failed</h2>
                <p>An error occurred while processing your course payment.<br>Please verify your payment details and try again.</p>
                <button type="button" class="btn-result-action retry" id="retry-course-payment-button">RETRY <i class="bi bi-arrow-clockwise"></i></button>
            </div>`;
        };

        const displayCoursePaymentScreen = (paymentDetails) => {
            if (!window.globalApplicationModalElement) {
                console.error("Modal element not found for course payment.");
                return;
            }
            const modalBody = window.globalApplicationModalElement.querySelector(".modal-body");
            const modalTitle = window.globalApplicationModalElement.querySelector(".modal-title");
            const modalFooter = window.globalApplicationModalElement.querySelector(".modal-footer");

            if (modalTitle) modalTitle.textContent = "Complete Course Payment";
            if (modalBody) {
                modalBody.innerHTML = createCoursePaymentDetailsHTML(paymentDetails);
                const payNowBtn = modalBody.querySelector("#pay-now-course-modal-button");
                if (payNowBtn) {
                    payNowBtn.addEventListener("click", () => handleCoursePaymentAttempt(paymentDetails));
                }
            }
            if (modalFooter) modalFooter.style.display = "none";
            
            if (window.globalApplicationModalInstance) {
                window.globalApplicationModalInstance.show();
            }
        };

        const displayCourseSuccessScreen = () => {
            if (!window.globalApplicationModalElement) return;
            const modalBody = window.globalApplicationModalElement.querySelector(".modal-body");
            const modalTitle = window.globalApplicationModalElement.querySelector(".modal-title");
            const modalFooter = window.globalApplicationModalElement.querySelector(".modal-footer");

            if (modalTitle) modalTitle.textContent = "Course Payment Successful";
            if (modalBody) {
                modalBody.innerHTML = createCoursePaymentSuccessHTML();
                const goHomeBtn = modalBody.querySelector("#go-home-course-button");
                if (goHomeBtn && window.globalApplicationModalInstance) {
                    goHomeBtn.addEventListener("click", () => window.globalApplicationModalInstance.hide());
                }
            }
            if (modalFooter) modalFooter.style.display = "none";
        };

        const displayCourseFailureScreen = (paymentDetails) => {
            if (!window.globalApplicationModalElement) return;
            const modalBody = window.globalApplicationModalElement.querySelector(".modal-body");
            const modalTitle = window.globalApplicationModalElement.querySelector(".modal-title");
            const modalFooter = window.globalApplicationModalElement.querySelector(".modal-footer");

            if (modalTitle) modalTitle.textContent = "Course Payment Issue";
            if (modalBody) {
                modalBody.innerHTML = createCoursePaymentFailureHTML();
                const retryBtn = modalBody.querySelector("#retry-course-payment-button");
                if (retryBtn && window.globalApplicationModalInstance) {
                    retryBtn.addEventListener("click", () => {
                        handleCoursePaymentAttempt(paymentDetails); // Retry the payment attempt
                    });
                }
            }
            if (modalFooter) modalFooter.style.display = "none";
        };
        
        const coursePaymentDetailsSaved = async (paymentDetails) => {
            const courseVerifyApiUrl = `https://school-api.republicschoolofjournalism.com/api/applications/register/payment-verify/${paymentDetails.order_id}`; 

            try {
                const response = await fetch(courseVerifyApiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    // body: JSON.stringify({ orderId: paymentDetails.order_id }), // Example if body is needed
                });

                if (!response.ok) {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        // Ignore if response body is not JSON or empty
                    }
                    console.error("Verification API request failed:", response.status, response.statusText, errorData);
                    throw new Error(`Verification failed: ${response.statusText || 'Server error'} (Status: ${response.status})`);
                }

                const result = await response.json();

                if (result.status === true && result.data && result.data.payment_status === "SUCCESS") {
                    console.log("Course payment verification successful.");
                    displayCourseSuccessScreen();
                } else {
                    console.error("Course payment verification unsuccessful or unexpected response:", result.message || "Unknown error from server", result);
                    displayCourseFailureScreen(paymentDetails);
                }
            } catch (error) {
                console.error("Error during course payment verification fetch operation:", error);
                displayCourseFailureScreen(paymentDetails);
            }
        };

        const handleCoursePaymentAttempt = (paymentDetails) => {
            if (!window.cashfree) {
                console.error("Cashfree SDK not initialized.");
                alert("Payment system error. Please try again later.");
                return;
            }
            let checkoutOptions = {
                paymentSessionId: paymentDetails.payment_session_id,
                orderId: paymentDetails.order_id,
                orderAmount: paymentDetails.order_amount,
                redirectTarget: "_modal", 
            };
            window.cashfree.checkout(checkoutOptions).then((result) => {
                if (result.redirect) {
                    if (typeof result.redirect === "string" && result.redirect.startsWith("http")) {
                        window.location = result.redirect;
                    } else {
                        console.warn("Cashfree result.redirect was not a valid URL:", result.redirect);
                        displayCourseFailureScreen(paymentDetails);
                    }
                } else if (result.error) {
                    console.error("Cashfree payment error:", result.error);
                    displayCourseFailureScreen(paymentDetails);
                } else if (result.paymentDetails && result.paymentDetails.paymentStatus === "SUCCESS") {
                    // If Cashfree directly gives a success status without redirect (can happen in some flows)
                    coursePaymentDetailsSaved(paymentDetails); // Or directly displayCourseSuccessScreen()
                } else {
                    // If no redirect and no clear error/success from Cashfree's immediate response,
                    // it might be necessary to call a verification endpoint.
                    coursePaymentDetailsSaved(paymentDetails);
                }
            }).catch((error) => {
                console.error(`Cashfree checkout onRejected function called: ${error.message}`, error);
                displayCourseFailureScreen(paymentDetails);
            });
        };

        // --- End of Course-Specific Payment Functions ---

        document.addEventListener("DOMContentLoaded", async function () { // Added async
            const paymentForm = document.getElementById("course-payment-form");
            const payNowButton = document.getElementById("pay-now-course");
            const applicationId = window.location.pathname.split('/').pop();

            let userData = { // To store fetched data
                name: "",
                dob: "", 
                email: "",
                contact: "",
                course_amount: 0.00, // Default to a number
                payment: null // Initialize payment object to null
            };

            try {
                const response = await fetch(`https://school-api.republicschoolofjournalism.com/api/applications/course/register/${applicationId}`); // Corrected API path
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                const result = await response.json();

                if (result.status && result.data) {
                    userData.name = result.data.name || "";
                    userData.email = result.data.email || "";
                    userData.contact = result.data.phone || "";
                    userData.dob = result.data.dob || ""; 
                    
                    if (result.data.payment) {
                        userData.payment = result.data.payment; // Store the whole payment object
                        // Use order_amount from payment object, which is already a number
                        userData.course_amount = typeof result.data.payment.order_amount === 'number' ? result.data.payment.order_amount : 0.00;
                    } else {
                        // Fallback if payment object is missing, though API spec implies it's there
                        const apiAmount = parseFloat(result.data.amount); 
                        userData.course_amount = !isNaN(apiAmount) ? apiAmount : 0.00;
                        console.warn("Payment object missing in API response, using root amount if available.");
                    }
                } else {
                    throw new Error(result.message || "Failed to retrieve user details or data missing.");
                }
            } catch (error) {
                console.error("Error fetching user data:", error);
                alert(`Could not load application details: ${error.message}. Please try again later.`);
                // Disable form if data loading fails
                Array.from(paymentForm.elements).forEach(el => el.disabled = true);
            }

            // Populate form fields
            document.getElementById("name").value = userData.name;
            document.getElementById("dob").value = userData.dob; 
            document.getElementById("email").value = userData.email;
            document.getElementById("contact").value = userData.contact;

            // Initialize modal globals from script.js if not already done
            if (!window.globalApplicationModalElement) {
                window.globalApplicationModalElement = document.getElementById("application-modal");
            }
            if (window.globalApplicationModalElement && typeof bootstrap !== "undefined" && !window.globalApplicationModalInstance) {
                window.globalApplicationModalInstance = bootstrap.Modal.getOrCreateInstance(window.globalApplicationModalElement);
            }

            // Initialize Cashfree SDK for this page
            if (typeof Cashfree !== "undefined") {
                window.cashfree = Cashfree({
                    mode: "production" 
                });
            } else {
                console.error("Cashfree factory function (Cashfree) not found. SDK script might have failed to load or was blocked.");
                alert("A critical error occurred with the payment system. Please refresh the page or contact support if the issue persists.");
                if (payNowButton) payNowButton.disabled = true; // Disable payment if SDK is not available
            }

            paymentForm.addEventListener("submit", function (event) {
                event.preventDefault();

                if (payNowButton.disabled) return; // Prevent submission if form is disabled

                if (!document.getElementById("terms").checked) {
                    alert("Please agree to the Terms and Conditions.");
                    return;
                }
                const paymentDetails = {
                    order_id: userData.payment?.order_id || applicationId, // Use API order_id, fallback to applicationId
                    order_amount: userData.course_amount, 
                    customer_details: {
                        customer_name: userData.name, 
                        customer_email: userData.email, 
                        customer_phone: userData.contact, 
                    },
                    payment_session_id: userData.payment?.payment_session_id || `dummy_session_${applicationId}`, // Use API session_id
                };
                
                // If the modal isn't open, open it.
                // displayPaymentScreen in script.js also shows the modal, but good to be sure.
                if (window.globalApplicationModalInstance) {
                     // The displayPaymentScreen function in script.js will populate and show the modal.
                     // However, handlePaymentAttempt is called directly by the original form's payment flow.
                     // For this new page, we want to trigger the same Cashfree checkout.
                     // The `handlePaymentAttempt` function expects the modal to be managed by `displayPaymentScreen`
                     // or similar. Let's call displayPaymentScreen first to set up the modal content,
                     // then handlePaymentAttempt will be triggered by the button inside that.

                    // To reuse the existing flow, we can call displayPaymentScreen which sets up the modal
                    // and its internal "Pay Now" button will call handleCoursePaymentAttempt.
                    displayCoursePaymentScreen(paymentDetails); // This will set up the modal with details and a pay button
                } else {
                    console.error("Modal instance (globalApplicationModalInstance) is not available.");
                    alert("Error: Payment modal not initialized.");
                }
            });
        });
    </script>
